on':
  github:
    branches:
      only: main
jobs:
  CloneRepo:name: STEPFLOW CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          API_BASE_URL: https://api.stepflow.app  # Set in workflow
        run: python -m pytest  # Add API ping test in tests