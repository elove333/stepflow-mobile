on':
  github:
    branches:
      only: main
jobs:
  CloneRepo:name: Potentia_Ludi CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Package.JSON
        uses: actions/setup-.JSON@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          API_BASE_URL: https://api.potentia_ludi.app  # Set in workflow
        run: package.json-m   # Add API ping test in tests