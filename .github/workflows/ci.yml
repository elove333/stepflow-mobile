# This is an example of a CI workflow with npm ci and legacy-peer-deps

name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Install Dependencies
      run: npm ci --legacy-peer-deps
    - name: Run Tests
      run: npm test
