name: Mobile CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Type check
        id: type_check
        continue-on-error: true
        run: npm run type-check

      - name: Tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Check summary
        if: always()
        run: |
          echo "lint: ${{ steps.lint.outcome }}"
          echo "type-check: ${{ steps.type_check.outcome }}"
          echo "tests: ${{ steps.tests.outcome }}"
